name: توليد صوت شاكر

# GitHub Pages بينشر المعمل من فرع main مباشرة.
# الخطوة دي بتولّد أي جمل ناقصة بصوت شاكر وتحفظها في المستودع، فيتنشر المعمل بالصوتين.

on:
  push:
    branches: [main]
    paths: ['tools/lines.json', 'tools/make_shakir.py', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shakir
  cancel-in-progress: false

jobs:
  shakir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: توليد الجمل الناقصة بصوت شاكر
        run: |
          pip install --quiet edge-tts
          python tools/make_shakir.py

      - name: حفظ الصوت في المستودع
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice/shakir
          git diff --cached --quiet || (git commit -m "صوت شاكر: جمل جديدة" && git pull --rebase -q && git push)
